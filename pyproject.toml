[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parentedu-replication"
version = "0.1.0"
description = "Replication of parental education associations with student performance"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "nbconvert>=7,<8",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<0.15",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "plotly>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
